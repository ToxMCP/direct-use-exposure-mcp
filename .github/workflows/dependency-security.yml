name: Dependency security

on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-security.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-security.yml

permissions:
  contents: read

jobs:
  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Export all locked runtime and development dependencies
        run: |
          uv lock --check
          uv export --frozen --all-extras --all-groups --no-emit-project --output-file /tmp/direct-use-requirements.txt
      - name: Audit the dependency lock against current vulnerability records
        run: uvx pip-audit==2.10.1 --strict --desc --requirement /tmp/direct-use-requirements.txt --no-deps --disable-pip
